@font-face{font-family:'Fredoka';font-style:normal;font-weight:300 500;font-display:block;src:local('Trebuchet MS'),local('TrebuchetMS'),local('Segoe UI'),local('Roboto'),local('Helvetica Neue'),local('Arial')}
:root{
  --ink:#16245c;--ink2:#4b5684;--ink3:#7c84a6;--line:#e7e5ef;--bg:#fbfaf6;--card:#fff;
  --pink:#f2317f;--pinkD:#c4155f;--pinkT:#ffe6f0;
  --sky:#2f80d0;--skyD:#1d5fa3;--skyT:#e3f0fc;
  --green:#2f9e63;--greenD:#1f7347;--greenT:#e1f5ea;
  --sun:#f6b20c;--sunD:#c98a00;--sunT:#fff3d1;
  --orange:#ef8a2b;--orangeD:#bf6511;--orangeT:#ffeedd;
  --purple:#8a5cd0;--purpleD:#6741a8;--purpleT:#efe7fb;
  --font:"Fredoka","Comic Sans MS","Trebuchet MS",sans-serif;
  --body:"Trebuchet MS","Segoe UI",Roboto,Arial,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
  --sh1:0 1px 2px rgba(22,36,92,.06),0 4px 14px rgba(22,36,92,.06);
  --sh2:0 2px 6px rgba(22,36,92,.06),0 18px 50px -12px rgba(22,36,92,.22);
  --c:var(--pink);--cD:var(--pinkD);--cT:var(--pinkT);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3{font-family:var(--font);font-weight:700;margin:0;letter-spacing:-.01em}
.c-sky{--c:var(--sky);--cD:var(--skyD);--cT:var(--skyT)}
.c-orange{--c:var(--orange);--cD:var(--orangeD);--cT:var(--orangeT)}
.c-pink{--c:var(--pink);--cD:var(--pinkD);--cT:var(--pinkT)}
.c-purple{--c:var(--purple);--cD:var(--purpleD);--cT:var(--purpleT)}
.c-green{--c:var(--green);--cD:var(--greenD);--cT:var(--greenT)}
.c-sun{--c:var(--sun);--cD:var(--sunD);--cT:var(--sunT)}

/* soft gradient world that takes the part's color, drifting slowly */
body{background:linear-gradient(160deg,#f6f3ff 0%,#fdf8f3 48%,#edf5ff 100%) fixed}
.aura{position:fixed;inset:-25%;z-index:0;pointer-events:none;animation:drift 26s ease-in-out infinite alternate;
  background:radial-gradient(34% 30% at 18% 14%,color-mix(in srgb,var(--c) 24%,transparent),transparent 70%),
             radial-gradient(40% 36% at 86% 82%,color-mix(in srgb,var(--c) 18%,transparent),transparent 70%),
             radial-gradient(28% 26% at 84% 16%,color-mix(in srgb,var(--sky) 14%,transparent),transparent 70%),
             radial-gradient(26% 24% at 14% 88%,color-mix(in srgb,var(--sun) 14%,transparent),transparent 70%)}
@keyframes drift{to{transform:translate3d(3%,-2%,0) rotate(4deg) scale(1.05)}}
.glass,.card,.hero,.bubble,.tabs,.item,.res,.printbox,.phead,.chip,.paths{background:rgba(255,255,255,.6)!important;-webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);border:1px solid rgba(255,255,255,.85);box-shadow:0 30px 60px -28px rgba(22,36,92,.32),0 2px 8px rgba(22,36,92,.04)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.floaty{animation:float 7s ease-in-out infinite}
#app{position:relative;z-index:1;height:100dvh;display:flex;flex-direction:column;max-width:1180px;margin:0 auto}

/* top bar */
.top{display:flex;align-items:center;gap:12px;padding:12px 16px 8px;padding-top:max(12px,env(safe-area-inset-top))}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--font);font-weight:700;font-size:15px;white-space:nowrap}
.brand i{width:26px;height:26px;border-radius:9px;background:linear-gradient(135deg,var(--pink),var(--purple) 55%,var(--sky));display:grid;place-items:center;color:#fff;font-style:normal;font-size:14px;box-shadow:0 4px 10px -3px rgba(138,92,208,.6)}
.brand small{font-family:var(--body);font-weight:600;color:var(--ink3);font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-left:2px}
.prog{flex:1;display:flex;gap:5px;align-items:center;min-width:0}
.seg{flex:1;height:6px;border-radius:6px;background:color-mix(in srgb,var(--ink) 9%,transparent);overflow:hidden;position:relative}
.seg b{position:absolute;inset:0;transform-origin:left;transform:scaleX(0);border-radius:6px;transition:transform .5s var(--ease)}
.count{font-size:13px;color:var(--ink3);font-weight:600;white-space:nowrap;min-width:52px;text-align:right}
.home{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink2)}
.home:hover{background:#fff;box-shadow:var(--sh1)}
@media (max-width:560px){.brand span,.brand small{display:none}}

#view{flex:1;min-height:0;position:relative}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}
.enter-r{animation:inR .5s var(--ease) both}.enter-l{animation:inL .5s var(--ease) both}.enter-u{animation:inU .6s var(--ease) both}
@keyframes inR{from{opacity:.35;transform:translateX(40px)}}@keyframes inL{from{opacity:.35;transform:translateX(-40px)}}@keyframes inU{from{opacity:0;transform:translateY(24px)}}

/* START */
.start{overflow-y:auto;padding:8px 16px 120px}
.start-inner{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.hero{position:relative;background:linear-gradient(140deg,#fff 0,#fff 45%,var(--pinkT) 100%);border-radius:28px;padding:22px 20px 20px;box-shadow:var(--sh2);overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--sun) 30%,transparent),transparent 70%)}
.hero .tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--pinkD);background:var(--pinkT);padding:5px 10px;border-radius:99px}
.hero h1{font-size:clamp(34px,8vw,48px);line-height:1.02;margin:12px 0 14px;max-width:62%}
.hero h1 em{font-style:normal;color:var(--pink)}
.goal{font-family:var(--font);font-weight:700;font-size:18px;line-height:1.35;color:var(--ink);position:relative;z-index:2;margin:0;background:rgba(255,255,255,.82);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 10px 30px -18px rgba(22,36,92,.4);border-radius:16px;padding:12px 14px}
.goal:before{content:"Your child's goal";display:block;font-family:var(--body);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin-bottom:4px}
.hero .friend{position:absolute;right:8px;top:58px;width:32%;max-width:170px;z-index:1}
.map{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.map div{border-radius:14px;padding:9px 6px 8px;text-align:center;background:var(--cT);color:var(--cD);font-family:var(--font);font-size:13px;line-height:1.1;font-weight:700}
.map div b{display:block;font-size:20px}
.card{background:var(--card);border-radius:22px;box-shadow:var(--sh1);padding:18px}
.card h3{font-size:20px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.card h3 small{font-family:var(--body);font-size:13px;color:var(--ink3);font-weight:600}
.need{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.need label{display:flex;align-items:center;gap:12px;min-height:48px;padding:8px 10px;border-radius:14px;cursor:pointer;transition:background .2s}
.need label:hover{background:var(--tintH,#f6f4fb)}
.need input{position:absolute;opacity:0;pointer-events:none}
.box{flex:none;width:28px;height:28px;border-radius:9px;border:2.5px solid var(--line);display:grid;place-items:center;transition:all .25s var(--spring);background:#fff}
.box svg{width:16px;height:16px;stroke:#fff;stroke-width:3.5;fill:none;stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .3s var(--ease) .05s}
.need input:checked+.box{background:var(--green);border-color:var(--green);transform:scale(1.08)}
.need input:checked+.box svg{stroke-dashoffset:0}
.need input:checked~span{color:var(--ink3);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--ink3) 50%,transparent)}
.need input:focus-visible+.box{outline:3px solid var(--sky);outline-offset:2px}
.need .thumb{margin-left:auto;width:38px;height:48px;border-radius:6px;object-fit:cover;box-shadow:var(--sh1);flex:none}
.tip{display:flex;gap:12px;align-items:flex-start;font-size:15px;color:var(--ink2)}
.tip img{width:56px;flex:none}

/* bottom action bar */
.bar{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:10px;padding:12px 16px;padding-bottom:max(14px,env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 60%,color-mix(in srgb,var(--bg) 0%,transparent));z-index:5}
.btn{min-height:56px;padding:0 22px;border-radius:18px;font-family:var(--font);font-weight:700;font-size:19px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .2s var(--spring),box-shadow .2s,background .2s}
.btn:active{transform:scale(.96)}
.btn-main{flex:1;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 70%,var(--purple)));color:#fff;box-shadow:0 10px 24px -10px var(--c)}
.btn-main:hover{box-shadow:0 14px 30px -10px var(--c)}
.btn-ghost{background:#fff;box-shadow:var(--sh1);color:var(--ink2);padding:0 16px}
.btn-ghost[disabled]{opacity:.35;pointer-events:none}
.btn-stuck{background:var(--sunT);color:var(--sunD);padding:0 16px;font-size:17px}
.btn svg{width:22px;height:22px;stroke:currentColor;stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.bar .wide{max-width:640px;margin:0 auto;display:flex;gap:10px;width:100%}

/* PART */
.part{display:grid;grid-template-rows:auto auto 1fr;padding:0 16px}
.phead{position:relative;border-radius:26px;padding:14px 14px 14px 108px;min-height:112px;color:var(--ink);display:flex;align-items:center;gap:10px;overflow:visible}
.phead:before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(70% 90% at 0% 100%,color-mix(in srgb,var(--c) 16%,transparent),transparent 70%),radial-gradient(50% 60% at 100% 0%,color-mix(in srgb,var(--c) 10%,transparent),transparent 70%);pointer-events:none}
.phead .kicker{color:var(--cD);opacity:1}
.phead .ptitle p{color:var(--ink2)}
.phead .ring{background:var(--cT);color:var(--cD)}
.phead .ring .trk{stroke:color-mix(in srgb,var(--c) 18%,#fff)}
.phead .ring .val{stroke:var(--c)}
.phead .tctl button{background:var(--cT);color:var(--cD)}
.phead .tctl button:hover{background:color-mix(in srgb,var(--c) 22%,#fff)}
.phead .ring.done{animation:pulseC 1.4s ease-in-out infinite}
@keyframes pulseC{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c) 45%,transparent)}50%{box-shadow:0 0 0 12px transparent}}
.pfriend{position:absolute;left:6px;bottom:-4px;width:98px;height:120px;pointer-events:none}
.pfriend img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:bottom;filter:drop-shadow(0 8px 10px rgba(0,0,0,.18));transform-origin:50% 100%}
.pfriend img.in{animation:pop .7s var(--spring) both,bob 3.2s ease-in-out .7s infinite}
.pfriend img.out{animation:fadeOut .25s ease both}
@keyframes pop{0%{opacity:0;transform:translateY(30px) scale(.6)}100%{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6px) rotate(-2deg)}}
@keyframes fadeOut{to{opacity:0;transform:scale(.85)}}
.ptitle{flex:1;min-width:0;position:relative}
.kicker{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.ptitle h2{font-size:clamp(22px,5.6vw,30px);line-height:1.05;margin:2px 0 2px}
.ptitle p{margin:0;font-size:14px;opacity:.92;font-weight:600}
.timer{position:relative;flex:none;width:84px;display:flex;flex-direction:column;align-items:center;gap:4px}
.ring{position:relative;width:74px;height:74px;border-radius:50%;background:rgba(255,255,255,.16);backdrop-filter:blur(6px);display:grid;place-items:center;transition:transform .2s var(--spring)}
.ring:active{transform:scale(.94)}
.ring svg.r{position:absolute;inset:0;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}
.ring .trk{stroke:rgba(255,255,255,.25)}
.ring .val{stroke:#fff;stroke-linecap:round;transition:stroke-dashoffset 1s linear,stroke .3s}
.ring .t{font-family:var(--font);font-weight:700;font-size:18px;line-height:1;position:relative;text-align:center}
.ring .t small{display:block;font-family:var(--body);font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.9;margin-top:3px}
.ring.done{animation:pulse 1.4s ease-in-out infinite}
.ring.done .val{stroke:var(--sun)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.55)}50%{box-shadow:0 0 0 10px rgba(255,255,255,0)}}
.tctl{display:flex;gap:4px}
.tctl button{font-size:12px;font-weight:700;padding:4px 8px;border-radius:99px;background:rgba(255,255,255,.2);color:#fff;min-height:28px}
.tctl button:hover{background:rgba(255,255,255,.32)}
.goalrow{font-size:14.5px;color:var(--ink2);margin:12px 4px 0;display:flex;gap:8px;align-items:baseline}
.goalrow b{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--cD);flex:none}

.tabs{position:relative;display:grid;grid-template-columns:repeat(3,1fr);background:#fff;border-radius:18px;padding:5px;box-shadow:var(--sh1);margin:12px 0 0}
.tabs button{position:relative;z-index:1;min-height:48px;border-radius:14px;font-family:var(--font);font-weight:700;font-size:15.5px;color:var(--ink3);transition:color .3s;display:flex;align-items:center;justify-content:center;gap:6px;line-height:1.05}
.tabs button .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;background:color-mix(in srgb,var(--ink) 8%,transparent);transition:background .3s,color .3s;flex:none}
.tabs button.on{color:var(--cD)}
.tabs button.on .n{background:var(--c);color:#fff}
.tabs button.past .n{background:var(--cT);color:var(--cD)}
.tabs .ind{position:absolute;top:5px;bottom:5px;left:5px;width:calc((100% - 10px)/3);border-radius:14px;background:var(--cT);transition:transform .45s var(--spring)}

.vp{position:relative;overflow:hidden;margin:0 -16px;min-height:0;touch-action:pan-y}
.track{display:flex;height:100%;transition:transform .5s var(--ease);will-change:transform}
.track.drag{transition:none}
.slide{flex:0 0 100%;height:100%;overflow-y:auto;padding:14px 16px 110px;overscroll-behavior:contain}
.slide-in{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.steplabel{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.steplabel .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.bubble{position:relative;background:#fff;border-radius:26px 26px 26px 8px;padding:18px 20px;box-shadow:var(--sh2);border:2px solid color-mix(in srgb,var(--c) 22%,transparent)}
.bubble .lbl{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--cD);margin-bottom:6px}
.bubble .lbl svg{width:16px;height:16px;stroke:currentColor;stroke-width:2.4;fill:none}
.say{font-family:var(--font);font-weight:700;font-size:clamp(21px,5.4vw,27px);line-height:1.28;margin:0;padding:8px 0;color:var(--ink)}
.say+.say{border-top:1.5px dashed var(--line)}
.slide.cur .say{animation:sayIn .55s var(--ease) both}
.slide.cur .say:nth-of-type(2){animation-delay:.12s}.slide.cur .say:nth-of-type(3){animation-delay:.24s}.slide.cur .say:nth-of-type(4){animation-delay:.36s}
@keyframes sayIn{from{opacity:0;transform:translateY(10px)}}
.say .hl{color:var(--cD);background:linear-gradient(transparent 62%,var(--cT) 62%);padding:0 2px;border-radius:3px}
.do{padding:2px 6px}
.do .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin-bottom:4px;display:flex;align-items:center;gap:6px}
.do ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.do li{font-size:16px;color:var(--ink2);padding-left:20px;position:relative}
.do li:before{content:"";position:absolute;left:4px;top:.6em;width:7px;height:7px;border-radius:2px;background:var(--c);opacity:.6;transform:rotate(45deg)}
.extras{display:flex;flex-direction:column;gap:10px}
.chip{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:8px 14px 8px 8px;box-shadow:var(--sh1);text-align:left;min-height:60px;transition:transform .2s var(--spring)}
.chip:hover{transform:translateY(-2px)}
.chip img{width:42px;height:54px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.chip .ico{width:48px;height:48px;border-radius:12px;background:var(--cT);color:var(--cD);display:grid;place-items:center;flex:none}
.chip .ico svg{width:22px;height:22px;fill:currentColor}
.chip b{font-family:var(--font);font-size:16px;display:block}
.chip small{color:var(--ink3);font-size:13px}
.paths{background:#fff;border-radius:20px;box-shadow:var(--sh1);padding:14px}
.paths h4{margin:0 0 8px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.lp{display:flex;gap:12px;align-items:flex-start;padding:8px 0}
.lp+.lp{border-top:1.5px dashed var(--line)}
.lp .gl{flex:none;width:64px;height:64px;border-radius:14px;background:#fff;display:grid;place-items:center;padding:4px;box-shadow:inset 0 0 0 1.5px var(--line)}
.lp .gl svg{width:100%;height:100%}
.need .thumbs{margin-left:auto;display:flex;gap:6px;flex:none;align-items:center}
.need .thumbs .thumb{margin:0}
.kitlink{font-size:13px;font-weight:700;color:var(--skyD);background:var(--skyT);border-radius:99px;padding:6px 10px;text-decoration:none;white-space:nowrap}
.hero h1.long{font-size:clamp(26px,6vw,36px)}
.sound-badge{position:fixed;left:50%;bottom:21%;z-index:25;transform:translate(-50%,10px) scale(.9);opacity:0;display:flex;align-items:center;gap:12px;background:var(--ink);color:#fff;border-radius:99px;padding:12px 22px 12px 14px;font-family:var(--font);font-weight:700;font-size:26px;box-shadow:0 24px 50px -18px rgba(22,36,92,.6);transition:opacity .3s,transform .45s var(--spring);pointer-events:none}
.sound-badge.on{opacity:1;transform:translate(-50%,0) scale(1)}
.sound-badge i{width:44px;height:44px;border-radius:50%;background:var(--pink);display:grid;place-items:center}
.sound-badge i svg{width:24px;height:24px;fill:#fff}
.sound-badge .wv{animation:wv 1s ease-in-out infinite}
@keyframes wv{50%{opacity:.3}}
.lp p{margin:0;font-size:16px;line-height:1.4}
.lp p .w{font-family:var(--font);font-weight:700;color:var(--ink)}

/* stuck sheet */
.scrim{position:fixed;inset:0;background:rgba(22,36,92,.32);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .3s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:640px;margin:0 auto;background:#fff;border-radius:28px 28px 0 0;padding:10px 20px 24px;padding-bottom:max(24px,env(safe-area-inset-bottom));box-shadow:0 -20px 60px -20px rgba(22,36,92,.4);transform:translateY(105%);transition:transform .45s var(--ease)}
.sheet.on{transform:none}
.grab{width:44px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 12px}
.sheet-h{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.sheet-h img{width:64px}
.sheet-h h3{font-size:24px}
.sheet-h p{margin:0;color:var(--ink3);font-size:14px}
.tipcard{background:var(--sunT);border-radius:18px;padding:14px 16px;margin-top:10px;font-size:17px;line-height:1.4}
.tipcard .mt{display:flex;flex-direction:column;gap:6px}
.tipcard .mt div{display:flex;gap:8px;align-items:baseline}
.tipcard .mt b{flex:none;font-family:var(--font);font-size:13px;background:#fff;color:var(--sunD);padding:2px 8px;border-radius:99px}
.sheet .close{margin-top:16px;width:100%}

/* modal */
.modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px;background:rgba(10,20,64,.78);opacity:0;pointer-events:none;transition:opacity .3s}
.modal.on{opacity:1;pointer-events:auto}
.modal .mbox{width:min(960px,100%);transform:scale(.94);transition:transform .4s var(--spring)}
.modal.on .mbox{transform:none}
.modal video,.modal img{width:100%;max-height:80dvh;object-fit:contain;border-radius:18px;background:#000;display:block}
.modal img{background:#fff}
.modal .x{position:absolute;top:max(12px,env(safe-area-inset-top));right:12px;width:48px;height:48px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:26px;line-height:1;color:var(--ink)}

/* CHECK */
.check{overflow-y:auto;padding:4px 16px 120px}
.check-in{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.ctitle{display:flex;align-items:center;gap:12px}
.ctitle img{width:84px}
.ctitle h2{font-size:clamp(28px,7vw,36px)}
.ctitle p{margin:2px 0 0;color:var(--ink2);font-size:15px}
.item{display:flex;gap:14px;align-items:center;background:#fff;border-radius:20px;padding:14px;box-shadow:var(--sh1);cursor:pointer;border:2px solid transparent;transition:border-color .25s,background .25s;min-height:72px}
.item.on{border-color:var(--green);background:linear-gradient(135deg,#fff,var(--greenT))}
.item .box{width:34px;height:34px;border-radius:11px}
.item.on .box{background:var(--green);border-color:var(--green);transform:scale(1.08)}
.item.on .box svg{stroke-dashoffset:0}
.item p{margin:0;font-size:16.5px}
.item p .q{font-family:var(--font);font-weight:700;color:var(--ink);display:block;font-size:18px;margin-bottom:2px}
.results{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.res{border-radius:18px;padding:12px 6px;min-height:76px;background:#fff;box-shadow:var(--sh1);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:2px solid transparent;transition:all .3s var(--spring)}
.res b{font-family:var(--font);font-size:18px}
.res small{font-size:12.5px;color:var(--ink3);font-weight:600}
.res.on{transform:translateY(-3px);border-color:var(--c);background:var(--cT);color:var(--cD)}
.plan{border-radius:22px;padding:16px 18px;background:var(--cT);border:2px solid color-mix(in srgb,var(--c) 30%,transparent);display:none}
.plan.on{display:block;animation:inU .45s var(--ease) both}
.plan .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--cD)}
.plan p{margin:4px 0 0;font-family:var(--font);font-size:20px;line-height:1.3;font-weight:700}
.hint{font-size:14px;color:var(--ink3);text-align:center;margin:0}

/* END */
.end{overflow-y:auto;padding:4px 16px 40px;text-align:center}
.end-in{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px;align-items:center}

}

/* ---------- timer ---------- */
function fmt(s) { const m = Math.floor(s / 60), r = s % 60; return `${m}:${String(r).padStart(2, '0')}`; }
function drawTimer() {
  const t = T[S.part], p = D.parts[S.part], v = $('#ringVal'), tt = $('#ringT'), ring = $('#ring');
  if (!v) return;
  const f = t.left / (p.minutes * 60);
  v.style.strokeDashoffset = (219.9 * (1 - f)).toFixed(2);
  ring.classList.toggle('done', t.left === 0);
  tt.innerHTML = t.left === 0 ? `Time!<small>well done</small>` : `${fmt(t.left)}<small>${t.run ? 'pause' : (t.left === p.minutes * 60 ? 'start' : 'go on')}</small>`;
  ring.setAttribute('aria-label', t.run ? 'Pause the timer' : 'Start the timer');
}
function toggleTimer() { T[S.part].run ? pauseTimer() : startTimer(); }
function startTimer() {
  const t = T[S.part]; if (t.left === 0) t.left = D.parts[S.part].minutes * 60;
  t.run = true; clearInterval(tick);
  // In play mode the whole part's minutes sweep by in the three steps on screen.
  const ms = PLAY ? 100 : 1000, dec = PLAY ? Math.ceil(D.parts[S.part].minutes * 60 / (3 * PLAY_STEP / 100)) : 1;
  tick = setInterval(() => { t.left = Math.max(0, t.left - dec); if (t.left === 0) { t.run = false; clearInterval(tick); } drawTimer(); }, ms);
  drawTimer();
}
function pauseTimer() { clearInterval(tick); T.forEach(t => t.run = false); drawTimer(); }

/* ---------- swipe ---------- */
function swipe(el) {
  let x0 = null, y0 = 0, dx = 0, lock = null;
  const tr = $('#track');
  el.addEventListener('pointerdown', e => { if (e.pointerType === 'mouse') return; x0 = e.clientX; y0 = e.clientY; dx = 0; lock = null; });
  el.addEventListener('pointermove', e => {
    if (x0 == null) return;
    dx = e.clientX - x0; const dy = e.clientY - y0;
    if (lock == null && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) lock = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
    if (lock === 'x') { tr.classList.add('drag'); const edge = (S.step === 0 && dx > 0) || (S.step === 2 && dx < 0) ? .35 : 1; tr.style.transform = `translateX(calc(${-S.step * 100}% + ${dx * edge}px))`; }
  });
  const end = () => {
    if (x0 == null) return; tr.classList.remove('drag');
    if (lock === 'x' && Math.abs(dx) > 60) { dx < 0 ? next() : back(); } else moveStep();
    x0 = null;
  };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
}

/* ---------- confetti ---------- */
function confetti() {
  const b = $('#againBtn'); if (b) b.onclick = back;
  if (RM) return;
  const cv = $('#confetti'), cx = cv.getContext('2d'), dpr = Math.min(2, devicePixelRatio || 1);
  const W = cv.width = innerWidth * dpr, H = cv.height = innerHeight * dpr;
  cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
  const cols = ['#f2317f', '#2f80d0', '#2f9e63', '#f6b20c', '#ef8a2b', '#8a5cd0'];
  const P = Array.from({ length: 150 }, (_, i) => ({ x: W / 2 + (Math.random() - .5) * W * .3, y: H * .42, vx: (Math.random() - .5) * 26 * dpr, vy: (-Math.random() * 22 - 8) * dpr,
    w: (6 + Math.random() * 6) * dpr, h: (10 + Math.random() * 8) * dpr, r: Math.random() * 6, vr: (Math.random() - .5) * .35, c: cols[i % cols.length], round: Math.random() < .3 }));
  const t0 = performance.now();
  (function frame(t) {
    const age = (t - t0) / 1000; cx.clearRect(0, 0, W, H);
    for (const p of P) { p.vx *= .985; p.vy = p.vy * .985 + .55 * dpr; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      cx.save(); cx.globalAlpha = Math.max(0, Math.min(1, 4.2 - age)); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c;
      if (p.round) { cx.beginPath(); cx.arc(0, 0, p.w / 2, 0, 7); cx.fill(); } else { cx.scale(1, Math.cos(age * 6 + p.r)); cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); }
      cx.restore(); }
    if (age < 4.4) requestAnimationFrame(frame); else cx.clearRect(0, 0, W, H);
  })(t0);
}

/* ---------- keys + boot ---------- */

  if (e.key === 'ArrowRight') { e.preventDefault(); next(); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); if (S.screen !== 'start') back(); }
});

$('#homeBtn').onclick = () => go({ screen: 'start' }, 'l');
const _render = render;
render = function (dir) { _render(dir); if (S.screen === 'start') bindStart(); };
/* ---------- first-time hint ---------- */
let hintShown = false;
function showHint() {
  if (hintShown || (!PLAY && store.get('hinted', false))) return;
  hintShown = true; store.set('hinted', true);
  const el = document.createElement('div'); el.className = 'hint-toast';
  el.innerHTML = 'Tap Next to move through the lesson<small>Or swipe. Say the big words out loud.</small>';
  document.body.appendChild(el);
  const r = $('#nextBtn') && $('#nextBtn').getBoundingClientRect();
  if (r && innerWidth < 980) { el.style.left = '16px'; el.style.right = '16px'; el.style.maxWidth = 'none'; el.style.bottom = (innerHeight - r.top + 14) + 'px'; el.style.setProperty('--ax', (r.left + r.width / 2 - 24) + 'px'); }
  else if (r) { el.style.right = 'auto'; el.style.left = Math.max(16, Math.min(innerWidth - el.offsetWidth - 16, r.left + r.width / 2 - el.offsetWidth / 2)) + 'px'; el.style.bottom = (innerHeight - r.top + 14) + 'px';
    el.style.setProperty('--ax', (r.left + r.width / 2 - parseFloat(el.style.left) - 8) + 'px'); }
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('on')));
  const nb = $('#nextBtn'); if (nb) nb.classList.add('glow');
  setTimeout(() => { el.classList.remove('on'); setTimeout(() => el.remove(), 500); }, 3000);
}

/* ---------- auto-play (?play=1): a hands-free tour for a screen recording ---------- */
const PLAY_STEP = 6500;
const sleep = ms => new Promise(r => setTimeout(r, ms));
// events for the recorder: it lays the approved sound clip and the music under the film at these moments
window.__ev = [];
const ev = (type, x) => window.__ev.push({ type, x, t: Date.now() });
async function soundCue(l) {
  const b = document.createElement('div'); b.className = 'sound-badge';
  b.innerHTML = `<i><svg viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3z"/><path class="wv" d="M15.5 8.5a5 5 0 0 1 0 7" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round"/><path class="wv" d="M18.5 5.5a9 9 0 0 1 0 13" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" style="animation-delay:.2s"/></svg></i>Listen: /${l}/`;
  document.body.appendChild(b); requestAnimationFrame(() => requestAnimationFrame(() => b.classList.add('on')));
  await sleep(450); ev('sound', l); await sleep(1500);
  b.classList.remove('on'); setTimeout(() => b.remove(), 500);
}
async function tap(el) { if (!el) return; el.classList.remove('press'); void el.offsetWidth; el.classList.add('press'); await sleep(260); el.click(); }
// the narrator (window.__NARR, set by the recorder: {key: {text, sec}}): say() logs the line for the recorder, shows it as
// captions a few words at a time in their own strip, and waits for it; without narration the old fixed pace is used
const NARR = window.__NARR || {};
const chunks = (t) => { const parts = t.match(/[^,.!?]+[,.!?]*/g).map((x) => x.trim()).filter(Boolean), out = [];
  for (const p of parts) { const w = p.split(' '); if (w.length <= 7) out.push(p); else { const h = Math.ceil(w.length / 2); out.push(w.slice(0, h).join(' '), w.slice(h).join(' ')); } } return out; };
async function say(key, min = 0) {
  const b = NARR[key]; const t0 = Date.now();
  if (b) { ev('voice', key); const cs = chunks(b.text), tot = cs.reduce((a, c) => a + c.length, 0), cc = $('#cc');
    for (const c of cs) { cc.textContent = c; ev('cap', c); await sleep(b.sec * 1000 * c.length / tot); }
    ev('capend'); cc.textContent = ''; await sleep(250); }
  const left = min - (Date.now() - t0); if (left > 0) await sleep(left);
}
async function autoplay() {
  try { localStorage.clear(); } catch (e) {}
  const cc = document.createElement('div'); cc.className = 'cc'; cc.innerHTML = '<span id="cc"></span>'; document.body.appendChild(cc);
  S = { screen: 'start', part: 0, step: 0 }; render('u'); progress();
  ev('start'); await sleep(1700); $('#logo').classList.add('off'); await sleep(600);
  await say('intro0', 1200);
  const ticking = (async () => { for (const box of document.querySelectorAll('.need input')) { await sleep(330); box.checked = true; box.dispatchEvent(new Event('change')); } })();
  await say('intro1', 1800); await ticking; await sleep(300);
  await tap($('#nextBtn'));
  const whatPart = Math.max(0, D.parts.findIndex((p) => p.kind === 'new skill')), stuckPart = Math.min(3, D.parts.length - 1);
  for (let p = 0; p < D.parts.length; p++) {
    await sleep(350); startTimer();
    for (let s = 0; s < 3; s++) {
      await say(`p${p}s${s}`, 2200);
      if (D.parts[p].sound && s < 2) { await say(`p${p}snd${s}`); await soundCue(D.parts[p].sound); await sleep(300); }
      if (p === whatPart && s === 0) { await tap($('.slide.cur [data-what]')); await say('what', 2300); closeSheet(); await sleep(500); }
      if (p === stuckPart && s === 2) { await tap($('#stuckBtn')); await say('stuck', 2300); closeSheet(); await sleep(500); }
      await tap($('#nextBtn'));
    }
  }
  await sleep(900);
  const checking = (async () => { await sleep(1200); for (const it of document.querySelectorAll('.item')) { await tap(it); await sleep(500); } })();
  await say('check0', 2000); await checking; await sleep(1200);
  await tap($('#nextBtn'));
  await sleep(600); await say('end', 2500); await sleep(800);
  ev('end');
}

(function boot() {
  if (PLAY) { autoplay(); return; }
  const h = location.hash.slice(1); const m = h.match(/^p(\d)s(\d)$/);
  if (m) S = { screen: 'part', part: Math.min(+m[1] - 1, D.parts.length - 1), step: Math.min(+m[2] - 1, 2) };
  else if (['check', 'end'].includes(h)) S.screen = h;
  render('u'); progress();
})();
</script>
</body>
