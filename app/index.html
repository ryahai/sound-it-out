<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free Reading App: Words Your Child Can Sound Out</title>
<link rel="canonical" href="https://sounditoutreading.com/app/">
<meta name="description" content="A free reading app for beginners. Every word is built only from the letter-sounds your child has been taught, so your child reads and does not guess.">
<link rel="stylesheet" href="./demo.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
</head>
<body data-theme="savannah">
<div class="stars-bg" aria-hidden="true"></div>
<div class="wrap" id="app"></div>

<div class="dock" id="dock" hidden>
  <button class="icon-btn" id="homeBtn" aria-label="Home">🏠</button>
  <div class="row">
    <button class="dock-btn" id="voiceBtn" aria-pressed="true">🔊 Read aloud</button>
    <button class="dock-btn" id="calmBtn">🫧 Calm corner</button>
    <button class="dock-btn" id="pauseBtn">⏸ Pause</button>
  </div>
</div>

<script src="./next.js"></script>
<script type="module" src="./demo.js"></script>
</body>
</html>
