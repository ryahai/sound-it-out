<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Pick the n sound</title>
<style>body{margin:0;background:#fff8e7;color:#1f2a44;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:19px;line-height:1.5}main{max-width:560px;margin:0 auto;padding:26px 16px 60px}h1{font-size:30px;margin:0 0 6px}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}button{font:800 34px system-ui,sans-serif;color:#1f2a44;background:#fff3c9;border:4px solid #1f2a44;border-radius:20px;padding:20px 0;cursor:pointer}button.on{background:#f2b705}button.m{background:#e4f0ff;font-size:24px;grid-column:1/-1}small{color:#5b6680}</style></head>
<body><main><h1>Pick the n sound</h1><p>Tap each letter to hear a different recording of the sound n. Tell me the letter of the one that sounds right. If none does, say so.</p>
<div class="g"><button data-s="A">A</button><button data-s="B">B</button><button data-s="C">C</button><button data-s="D">D</button><button data-s="E">E</button><button data-s="F">F</button><button class="m" data-s="M">the sound m, to compare</button></div>
<small>F is the one in use now.</small></main>
<script>var a=null;document.querySelectorAll("button").forEach(function(b){b.addEventListener("click",function(){if(a)a.pause();document.querySelectorAll("button").forEach(function(x){x.classList.remove("on")});a=new Audio(b.dataset.s+".mp3");b.classList.add("on");a.onended=function(){b.classList.remove("on")};a.play()})});</script></body></html>
